name: Deploy to Azure Container Apps

# Triggers:
#   - Every push to main
#   - Manual "Run workflow" from the Actions tab
#
# AUTH (Device-code access token):
#   Before each deploy, run `bash scripts/refresh-azure-token.sh` locally to
#   produce a short-lived access token via device-code login. This token is
#   stored as the AZURE_ACCESS_TOKEN secret and used by the workflow.
#
#   One-time setup (see docs/SETUP_CI_CD.md):
#     1. Run `bash scripts/refresh-azure-token.sh` to do device-code login.
#     2. Token is automatically stored as AZURE_ACCESS_TOKEN secret.
#     3. Token is valid ~60 minutes. Refresh before every deploy.
#     4. Set GOOGLE_CLIENT_*, GH_OAUTH_*, SESSION_SECRET secrets.
#     5. Set AZURE_RESOURCE_GROUP, AZURE_LOCATION, AZURE_REGISTRY_LOGIN_SERVER variables.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      session_secret:
        description: 'Session secret (optional — random 64-char value if blank). Must be >= 32 chars.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to Azure
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve SESSION_SECRET
        id: secrets
        env:
          PROVIDED: ${{ github.event.inputs.session_secret }}
        run: |
          SESSION_SECRET="${PROVIDED:-$(openssl rand -hex 32)}"
          echo "session_secret=$SESSION_SECRET" >> "$GITHUB_OUTPUT"

      - name: Verify Azure CLI is available
        run: |
          # Azure CLI ships pre-installed on the ubuntu-latest runner image.
          if command -v az >/dev/null 2>&1; then
            az version
          else
            echo "az not found — installing via apt (sudo)..."
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
            az version
          fi

      - name: Authenticate to Azure (device-code token)
        run: |
          az login --service-principal \
            --username "04b07795-8ddb-461a-bbee-02f541bf1219" \
            --password "${{ secrets.AZURE_ACCESS_TOKEN }}" \
            --tenant "1a54e107-6999-4f70-acdb-194c649c72f2" \
            --allow-no-subscriptions \
            --output none
          az account set --subscription "c3c7cf3e-d1a9-4653-b9a9-a43188215731"
          echo "✓ Authenticated to Azure"

      - name: Deploy to Azure Container Apps
        env:
          AZURE_SUBSCRIPTION_ID: c3c7cf3e-d1a9-4653-b9a9-a43188215731
          AZURE_TENANT_ID: 1a54e107-6999-4f70-acdb-194c649c72f2
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_REGISTRY_LOGIN_SERVER: ${{ vars.AZURE_REGISTRY_LOGIN_SERVER }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # GitHub forbids Actions secrets named GITHUB_*, so the GitHub OAuth
          # app credentials are stored under GH_OAUTH_* secret names. They
          # are mapped here to the app's own GITHUB_CLIENT_ID/SECRET env vars.
          GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ steps.secrets.outputs.session_secret }}
        run: |
          bash scripts/deploy-ci.sh

      - name: Fetch deployed frontend URL
        if: success()
        id: url
        env:
          SUBSCRIPTION_ID: c3c7cf3e-d1a9-4653-b9a9-a43188215731
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          FQDN=$(az containerapp show \
            --name frontend-app \
            --resource-group "$RESOURCE_GROUP" \
            --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || echo "")
          if [[ -z "$FQDN" || "$FQDN" == "None" ]]; then
            echo "WARNING: Could not fetch FQDN. It may still be provisioning."
            FQDN=""
          fi
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      - name: Deployment summary (success)
        if: success()
        run: |
          {
            echo "## ✅ Deployment Successful"
            echo ""
            if [[ -n "${{ steps.url.outputs.fqdn }}" ]]; then
              echo "**Frontend URL:** [https://${{ steps.url.outputs.fqdn }}](https://${{ steps.url.outputs.fqdn }})"
            else
              echo "Frontend is deploying. Check the Azure Portal or re-run the"
              echo "'Fetch deployed frontend URL' step in a minute."
            fi
            echo ""
            echo "Resource group: \`${{ vars.AZURE_RESOURCE_GROUP }}\`"
            echo ""
            echo "### Next steps"
            echo "1. Register the frontend URL as an OAuth redirect URI (see \`docs/SETUP_CI_CD.md\`)."
            echo "2. Open the URL and test login."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment summary (failure)
        if: failure()
        run: |
          {
            echo "## ❌ Deployment Failed"
            echo ""
            echo "Check the logs above for the specific error. Common causes:"
            echo ""
            echo "- **OIDC login failed** — the federated identity credential"
            echo "  isn't registered, or the app's service principal lacks the"
            echo "  Contributor role on the subscription. See"
            echo "  \`docs/AZURE_OIDC_SETUP.md\`."
            echo "- Missing GitHub secrets or variables."
            echo "- \`SESSION_SECRET\` under 32 chars."
          } >> "$GITHUB_STEP_SUMMARY"
