name: Deploy to Azure Container Apps

# Triggers:
#   - Every push to main
#   - Manual "Run workflow" from the Actions tab
#
# AUTH (device code, no service principal):
#   Before each deploy, run locally:  bash scripts/refresh-azure-token.sh
#   This does `az login --use-device-code` (browser flow), captures the
#   ~60-minute access token, and stores it as the AZURE_ACCESS_TOKEN
#   GitHub secret. The workflow reads that secret and uses `az rest`
#   (which accepts a raw Bearer token) for all Azure API calls.
#
#   The token expires in ~60 minutes, so refresh before each deploy.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      session_secret:
        description: 'Session secret (optional — random 64-char value if blank). Must be >= 32 chars.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to Azure
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve SESSION_SECRET
        id: secrets
        env:
          PROVIDED: ${{ github.event.inputs.session_secret }}
        run: |
          SESSION_SECRET="${PROVIDED:-$(openssl rand -hex 32)}"
          echo "session_secret=$SESSION_SECRET" >> "$GITHUB_OUTPUT"

      - name: Verify Azure CLI is available
        run: |
          # Azure CLI ships pre-installed on the ubuntu-latest runner image.
          # The old 'curl | bash' apt install failed (no sudo); there's no
          # official setup-azcli action either. If 'az' is somehow missing,
          # fall back to a sudo apt install (the runner grants sudo -S).
          if command -v az >/dev/null 2>&1; then
            az version
          else
            echo "az not found — installing via apt (sudo)..."
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
            az version
          fi

      - name: Validate Azure token
        env:
          AZURE_ACCESS_TOKEN: ${{ secrets.AZURE_ACCESS_TOKEN }}
        run: |
          if [[ -z "$AZURE_ACCESS_TOKEN" ]]; then
            echo "ERROR: AZURE_ACCESS_TOKEN secret is empty."
            echo "Run 'bash scripts/refresh-azure-token.sh' locally to generate"
            echo "a fresh token, then re-run this workflow."
            exit 1
          fi
          echo "Token present (${#AZURE_ACCESS_TOKEN} chars)."

      - name: Deploy to Azure Container Apps
        env:
          AZURE_ACCESS_TOKEN: ${{ secrets.AZURE_ACCESS_TOKEN }}
          AZURE_SUBSCRIPTION_ID: c3c7cf3e-d1a9-4653-b9a9-a43188215731
          AZURE_TENANT_ID: 1a54e107-6999-4f70-acdb-194c649c72f2
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_REGISTRY_LOGIN_SERVER: ${{ vars.AZURE_REGISTRY_LOGIN_SERVER }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          SESSION_SECRET: ${{ steps.secrets.outputs.session_secret }}
        run: |
          bash scripts/deploy-ci.sh

      - name: Fetch deployed frontend URL
        if: success()
        id: url
        env:
          AZURE_ACCESS_TOKEN: ${{ secrets.AZURE_ACCESS_TOKEN }}
          SUBSCRIPTION_ID: c3c7cf3e-d1a9-4653-b9a9-a43188215731
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          FQDN=$(az rest \
            --method GET \
            --url "/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/Microsoft.ContainerService/containerApps/frontend-app?api-version=2024-03-01" \
            --headers "Authorization=Bearer ${AZURE_ACCESS_TOKEN}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv 2>/dev/null || echo "")
          if [[ -z "$FQDN" || "$FQDN" == "None" ]]; then
            echo "WARNING: Could not fetch FQDN via az rest. It may still be provisioning."
            FQDN=""
          fi
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      - name: Deployment summary (success)
        if: success()
        run: |
          {
            echo "## ✅ Deployment Successful"
            echo ""
            if [[ -n "${{ steps.url.outputs.fqdn }}" ]]; then
              echo "**Frontend URL:** [https://${{ steps.url.outputs.fqdn }}](https://${{ steps.url.outputs.fqdn }})"
            else
              echo "Frontend is deploying. Check the Azure Portal or re-run the"
              echo "'Fetch deployed frontend URL' step in a minute."
            fi
            echo ""
            echo "Resource group: \`${{ vars.AZURE_RESOURCE_GROUP }}\`"
            echo ""
            echo "### Next steps"
            echo "1. Register the frontend URL as an OAuth redirect URI (see \`docs/SETUP_CI_CD.md\`)."
            echo "2. Open the URL and test login."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment summary (failure)
        if: failure()
        run: |
          {
            echo "## ❌ Deployment Failed"
            echo ""
            echo "Most likely cause: **the Azure access token expired** (valid ~60 min)."
            echo ""
            echo "Fix: run \`bash scripts/refresh-azure-token.sh\` locally, complete the"
            echo "browser device-code flow, then re-run this workflow."
            echo ""
            echo "Other causes:"
            echo "- AZURE_ACCESS_TOKEN secret is empty (refresh script wasn't run)"
            echo "- Missing GitHub secrets or variables"
            echo "- SESSION_SECRET under 32 chars"
          } >> "$GITHUB_STEP_SUMMARY"
