server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. `add_header` in a location/location-level block
    # overrides the whole inherited set (not merges), so each static-response
    # location re-emits the full set via a shared snippet below. HSTS is
    # intentionally omitted: this container is served over HTTP and TLS
    # terminates at the reverse-proxy edge, so the browser would reject the
    # header on the plain-HTTP hop. Add `Strict-Transport-Security` at the TLS
    # edge if/when one fronts this service.

    # Full header set, reused by the static locations (nginx has no native
    # includes-with-args for add_header, so we repeat the set explicitly).
    # --- static headers ---
    # X-Content-Type-Options: nosniff
    # X-Frame-Options: DENY
    # Referrer-Policy: strict-origin-when-cross-origin
    # CSP: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
    #      img-src 'self' data: https:; connect-src 'self' ws: wss:;
    #      object-src 'none'; base-uri 'self'; frame-ancestors 'none';
    #      form-action 'self'

    # SPA fallback. index.html is never cached so deploys pick up fresh
    # bundles immediately.
    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' ws: wss: https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build assets: long-cache immutable.
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' ws: wss: https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # REST API reverse proxy (security headers on proxied API responses are
    # set by the Fastify app, not here).
    location /api/ {
        proxy_pass http://backend-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy.
    location /ws {
        proxy_pass http://backend-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
